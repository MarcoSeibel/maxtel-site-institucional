<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mensagens Recebidas</title>

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <header class="cabecalho">
        <h1>Mensagens Recebidas</h1>
        <p>Confira as mensagens enviadas através do formulário.</p>
    </header>

    <main class="conteudo">

        <section class="mensagens">

            <h2>Lista de mensagens</h2>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Mensagem</th>
                        </tr>
                    </thead>

                    <tbody>
                        <!--
                            As mensagens serão recuperadas
                            aqui posteriormente com JavaScript.
                        -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer class="rodape">
        <p>&copy; 2026 - Loja de Tecnologia</p>
    </footer>

</body>

</html>
